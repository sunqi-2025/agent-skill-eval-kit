name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.9", "3.11", "3.12" ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Self-audit repository as an Agent Skill (--spec --strict)
        run: python3 scripts/skill_auditor.py . --spec --strict
      - name: Smoke test CLI against good fixture
        run: python3 skill_auditor.py examples/sample-good-skill --strict
      - name: Build and verify clean marketplace ZIP package
        run: python3 scripts/package_skill.py
